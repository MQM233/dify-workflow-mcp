      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "import re\n\ndef main(github_url: str) -> dict:\n    raw = (github_url or '').strip()\n    match = re.search(r'https?://github\\.com/([^/\\s]+)/([^/\\s#?]+)', raw)\n    if not match:\n        return {\n            'owner': '',\n            'repo': '',\n            'repo_full_name': '',\n            'repo_web_url': raw,\n            'api_readme_url': 'https://api.github.com/zen',\n            'api_structure_url': 'https://api.github.com/zen',\n            'input_error': 'Invalid GitHub repository URL. Expected https://github.com/{owner}/{repo}.'\n        }\n    owner = match.group(1)\n    repo = match.group(2)\n    if repo.endswith('.git'):\n        repo = repo[:-4]\n    repo_full_name = f'{owner}/{repo}'\n    return {\n        'owner': owner,\n        'repo': repo,\n        'repo_full_name': repo_full_name,\n        'repo_web_url': f'https://github.com/{repo_full_name}',\n        'api_readme_url': f'https://api.github.com/repos/{repo_full_name}/readme',\n        'api_structure_url': f'https://api.github.com/repos/{repo_full_name}/contents',\n        'input_error': ''\n    }"
        code_language: python3
        desc: 从用户输入中提取 owner/repo，并构造 GitHub API URL。
        outputs:
          api_readme_url:
            children: null
            type: string
          api_structure_url:
            children: null
            type: string
          input_error:
            children: null
            type: string
          owner:
            children: null
            type: string
          repo:
            children: null
            type: string
          repo_full_name:
            children: null
            type: string
          repo_web_url:
            children: null
            type: string
        selected: false
        title: 解析 GitHub URL
        type: code
        variables:
        - value_selector:
          - '1756100000001'
          - github_url
          variable: github_url
      height: 98
      id: '1756100000002'
      position:
        x: 420
        y: 260
      positionAbsolute:
        x: 420
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data: []
          type: none
        desc: 调用 GitHub API 获取 README 元数据和 base64 内容。
        headers: "Accept:application/vnd.github+json\nUser-Agent:Dify-GitHub-Project-Analyzer"
        method: get
        params: ''
        retry_config:
          max_retries: 2
          retry_enabled: true
          retry_interval: 1000
        selected: false
        timeout:
          max_connect_timeout: 0
          max_read_timeout: 0
          max_write_timeout: 0
        title: 获取 README
        type: http-request
        url: '{{#1756100000002.api_readme_url#}}'
        variables:
        - value_selector:
          - '1756100000002'
          - api_readme_url
          variable: api_readme_url
      height: 134
      id: '1756100000003'
      position:
        x: 760
        y: 160
      positionAbsolute:
        x: 760
        y: 160

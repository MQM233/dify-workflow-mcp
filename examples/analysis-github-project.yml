          value_type: string
          variable: readme_error
        - value_selector:
          - '1756100000006'
          - structure_error
          value_type: string
          variable: structure_error
        selected: false
        title: 结束
        type: end
      height: 116
      id: '1756100000008'
      position:
        x: 1780
        y: 260
      positionAbsolute:
        x: 1780
        y: 260
      selected: false
      sourcePosition: right

app:
  description: 由 Workflow IR 渲染生成的最小 LLM 工作流。
  icon: 🤖
  icon_background: "#FFEAD5"
  mode: workflow
  name: 严格生成器示例
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.3.1
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ""
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ""
      voice: ""
  graph:
    edges:
      - id: 1757000000001-source-1757000000002-target
        source: "1757000000001"
        sourceHandle: source
        target: "1757000000002"
        targetHandle: target
        type: custom
        data:
          sourceType: start
          targetType: llm
          isInIteration: false
          isInLoop: false
        zIndex: 0
      - id: 1757000000002-source-1757000000003-target
        source: "1757000000002"
        sourceHandle: source
        target: "1757000000003"
        targetHandle: target
        type: custom
        data:
          sourceType: llm
          targetType: end
          isInIteration: false
          isInLoop: false
        zIndex: 0
    nodes:
      - id: "1757000000001"
        type: custom
        sourcePosition: right
        targetPosition: left
        position:
          x: 80
          y: 260
        positionAbsolute:
          x: 80
          y: 260
        width: 244
        height: 98
        data:
          title: Start
          type: start
          variables:
            - variable: input_text
              label: 输入文本
              type: paragraph
              required: true
              max_length: 5000
              options: []
      - id: "1757000000002"
        type: custom
        sourcePosition: right
        targetPosition: left
        position: &a1
          x: 420
          y: 260
        positionAbsolute: *a1
        width: 244
        height: 98
        data:
          title: 总结 LLM
          desc: ""
          type: llm
          model:
            provider: langgenius/deepseek/deepseek
            name: deepseek-chat
            mode: chat
            completion_params:
              temperature: 0.2
          prompt_template:
            - role: system
              text: 你是一个严谨的中文摘要助手。请用要点总结用户输入，最后给出一句结论。
            - role: user
              text: "{{{#1757000000001.input_text#}}}"
          variables: []
          context:
            enabled: false
            variable_selector: []
          vision:
            enabled: false
      - id: "1757000000003"
        type: custom
        sourcePosition: right
        targetPosition: left
        position: &a2
          x: 760
          y: 260
        positionAbsolute: *a2
        width: 244
        height: 98
        data:
          title: End
          desc: ""
          type: end
          outputs:
            - variable: summary
              value_selector:
                - "1757000000002"
                - text
              value_type: string
    viewport:
      x: 0
      y: 0
      zoom: 0.7

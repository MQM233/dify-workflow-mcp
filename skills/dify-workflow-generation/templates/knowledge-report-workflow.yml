app:
  description: One-shot report workflow grounded in a Dify knowledge base.
  icon: 📚
  icon_background: '#E0F2FE'
  mode: workflow
  name: Knowledge Report Workflow
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.3.1
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload: {enabled: false}
    opening_statement: ''
    retriever_resource: {enabled: true}
    sensitive_word_avoidance: {enabled: false}
    speech_to_text: {enabled: false}
    suggested_questions: []
    suggested_questions_after_answer: {enabled: false}
    text_to_speech: {enabled: false}
  graph:
    nodes:
    - id: '1756220000001'
      type: custom
      position: {x: 80, y: 260}
      positionAbsolute: {x: 80, y: 260}
      sourcePosition: right
      targetPosition: left
      width: 244
      data:
        title: Start
        type: start
        variables:
        - label: Question
          max_length: 3000
          options: []
          required: true
          type: paragraph
          variable: question
    - id: '1756220000002'
      type: custom
      position: {x: 420, y: 260}
      positionAbsolute: {x: 420, y: 260}
      sourcePosition: right
      targetPosition: left
      width: 244
      data:
        title: Knowledge Retrieval
        type: knowledge-retrieval
        query_variable_selector: ['1756220000001', question]
        dataset_ids:
        - REPLACE_WITH_DATASET_ID
        retrieval_mode: multiple
        multiple_retrieval_config:
          top_k: 5
          score_threshold: null
          reranking_enable: false
        metadata_filtering_mode: disabled
    - id: '1756220000003'
      type: custom
      position: {x: 760, y: 260}
      positionAbsolute: {x: 760, y: 260}
      sourcePosition: right
      targetPosition: left
      width: 244
      data:
        title: Grounded Report LLM
        type: llm
        context:
          enabled: true
          variable_selector: ['1756220000002', result]
        model:
          completion_params: {temperature: 0.2}
          mode: chat
          name: deepseek-chat
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - role: system
          text: |
            Produce a grounded Markdown report based on retrieved knowledge.
            Mark missing information clearly. End with a compact JSON summary.
        - role: user
          text: '{{{#1756220000001.question#}}}'
        variables: []
        vision: {enabled: false}
    - id: '1756220000004'
      type: custom
      position: {x: 1100, y: 260}
      positionAbsolute: {x: 1100, y: 260}
      sourcePosition: right
      targetPosition: left
      width: 244
      data:
        title: End
        type: end
        outputs:
        - variable: report
          value_selector: ['1756220000003', text]
          value_type: string
    edges:
    - id: 1756220000001-source-1756220000002-target
      source: '1756220000001'
      sourceHandle: source
      target: '1756220000002'
      targetHandle: target
      type: custom
      data: {sourceType: start, targetType: knowledge-retrieval, isInIteration: false, isInLoop: false}
      zIndex: 0
    - id: 1756220000002-source-1756220000003-target
      source: '1756220000002'
      sourceHandle: source
      target: '1756220000003'
      targetHandle: target
      type: custom
      data: {sourceType: knowledge-retrieval, targetType: llm, isInIteration: false, isInLoop: false}
      zIndex: 0
    - id: 1756220000003-source-1756220000004-target
      source: '1756220000003'
      sourceHandle: source
      target: '1756220000004'
      targetHandle: target
      type: custom
      data: {sourceType: llm, targetType: end, isInIteration: false, isInLoop: false}
      zIndex: 0
    viewport: {x: 0, y: 0, zoom: 0.7}

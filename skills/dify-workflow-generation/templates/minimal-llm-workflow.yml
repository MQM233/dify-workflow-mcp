app:
  description: Minimal one-shot text processing workflow.
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: workflow
  name: Minimal LLM Workflow
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.3.1
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
    - data: {isInIteration: false, isInLoop: false, sourceType: start, targetType: llm}
      id: 1756200000001-source-1756200000002-target
      source: '1756200000001'
      sourceHandle: source
      target: '1756200000002'
      targetHandle: target
      type: custom
      zIndex: 0
    - data: {isInIteration: false, isInLoop: false, sourceType: llm, targetType: end}
      id: 1756200000002-source-1756200000003-target
      source: '1756200000002'
      sourceHandle: source
      target: '1756200000003'
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        title: Start
        type: start
        variables:
        - label: Input Text
          max_length: 20000
          options: []
          required: true
          type: paragraph
          variable: input_text
      id: '1756200000001'
      position: {x: 80, y: 260}
      positionAbsolute: {x: 80, y: 260}
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context: {enabled: false, variable_selector: []}
        model:
          completion_params: {temperature: 0.2}
          mode: chat
          name: deepseek-chat
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - role: system
          text: Replace this with the workflow-specific system prompt.
        - role: user
          text: '{{{#1756200000001.input_text#}}}'
        title: LLM
        type: llm
        variables: []
        vision: {enabled: false}
      id: '1756200000002'
      position: {x: 420, y: 260}
      positionAbsolute: {x: 420, y: 260}
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        outputs:
        - value_selector: ['1756200000002', text]
          value_type: string
          variable: result
        title: End
        type: end
      id: '1756200000003'
      position: {x: 760, y: 260}
      positionAbsolute: {x: 760, y: 260}
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport: {x: 0, y: 0, zoom: 0.7}
